version: '3.8'

services:
  # MySQL база данных
  mysql:
    image: mysql:5.7
    container_name: farm_manager_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-farm_db}
      MYSQL_USER: ${DB_USER:-radaev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farm_manager_network

  # PHP-FPM сервис
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: farm_manager_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - backend_runtime:/var/www/html/backend/runtime
      - backend_assets:/var/www/html/backend/web/assets
      - frontend_runtime:/var/www/html/frontend/runtime
      - frontend_assets:/var/www/html/frontend/web/assets
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-farm_db}
      DB_USER: ${DB_USER:-radaev}
      DB_PASSWORD: ${DB_PASSWORD:-123123}
      YII_DEBUG: ${YII_DEBUG:-true}
      YII_ENV: ${YII_ENV:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - farm_manager_network

  # Nginx веб-сервер
  nginx:
    image: nginx:alpine
    container_name: farm_manager_nginx
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "${FRONTEND_PORT:-8081}:8081"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - farm_manager_network

  # phpMyAdmin (опционально)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: farm_manager_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-radaev}
      PMA_PASSWORD: ${DB_PASSWORD:-123123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      - mysql
    networks:
      - farm_manager_network

# Volumes для данных
volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local
  backend_runtime:
    driver: local
  backend_assets:
    driver: local
  frontend_runtime:
    driver: local
  frontend_assets:
    driver: local

# Сеть
networks:
  farm_manager_network:
    driver: bridge

